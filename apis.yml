x-website-note: >-
  http://www.5lmeet.com/ is the website address 5Lmeet itself publishes, but from a US vantage on
  2026-09-05 only one of its three A records answered and it served the stock unconfigured
  "IIS Windows Server" welcome page over plain HTTP; there is no TLS listener on any of them.
  Geo-restriction of the two unreachable Alibaba Cloud Beijing addresses cannot be ruled out, so
  the pointer is kept rather than removed, with the observation recorded here and in
  security/5lmeet-domain-security.yml.
