aid: 5lmeet
name: 5Lmeet
description: >-
  5Lmeet (Chinese brand 共享际, operated by 优享创智 / UR Community) is a Beijing-based urban
  space operator founded in December 2015 by Dr. Mao Daqing, the former vice-chairman of China
  Vanke and founder of Ucommune. It runs an "urban renewal and spatial reconstruction" model that
  blends co-working, co-living, food and beverage, retail, fitness and cultural programming into
  single mixed-use compounds — the name stands for livable, linked, liberal, lively and landscape.
  Its Dongsi compound in Beijing pairs a basement co-working floor with a cafe and bakery, a gym,
  the Hatchery food incubator, the Unread bookstore, a 24-hour convenience store, residential units
  and a rooftop garden. The company raised roughly RMB 400 million in October 2016 and a USD 14.55
  million Series B in early 2017 led by GIC, Singapore's sovereign wealth fund, alongside Kaifeng
  Culture Tourism Investment Group, and is valued in the secondary market rather than publicly
  listed. 5Lmeet is a real-estate and hospitality operator, not a software vendor: the only software
  it has published is an end-user iPad visitor-management app for its own front desks, and it
  operates no developer program, public API, SDK or machine-readable contract of any kind.
